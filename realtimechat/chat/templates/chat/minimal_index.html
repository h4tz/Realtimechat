<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Chat - Join Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        .rooms {
            margin-top: 2rem;
            text-align: left;
        }

        .room-item {
            background-color: #f8f9fa;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-item:hover {
            background-color: #e9ecef;
        }

        .room-name {
            font-weight: 500;
            color: #2c3e50;
        }

        .room-count {
            background-color: #3498db;
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .error {
            color: #e74c3c;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minimal Chat</h1>

        <div class="input-group">
            <input type="text" id="room-input" placeholder="Enter room name..." autocomplete="off">
        </div>

        <button id="join-room">Join Room</button>

        <div class="error" id="error-message"></div>

        <div class="rooms">
            <h3 style="color: #2c3e50; margin-bottom: 1rem; font-weight: 400;">Popular Rooms</h3>
            {% for room in popular_rooms %}
            <div class="room-item" onclick="joinRoom('{{ room.room }}')">
                <span class="room-name">{{ room.room }}</span>
                <span class="room-count">{{ room.message_count }}</span>
            </div>
            {% empty %}
            <p style="color: #7f8c8d; font-size: 0.9rem;">No rooms yet. Create one above!</p>
            {% endfor %}
        </div>

        {% if recent_rooms %}
        <div class="rooms" style="margin-top: 1.5rem;">
            <h3 style="color: #2c3e50; margin-bottom: 1rem; font-weight: 400;">Your Recent Rooms</h3>
            {% for room_name in recent_rooms %}
            <div class="room-item" onclick="joinRoom('{{ room_name }}')">
                <span class="room-name">{{ room_name }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>

    <script>
        const roomInput = document.getElementById('room-input');
        const joinButton = document.getElementById('join-room');
        const errorMessage = document.getElementById('error-message');

        function joinRoom(roomName = null) {
            const room = roomName || roomInput.value.trim();

            if (!room) {
                errorMessage.textContent = 'Please enter a room name';
                return;
            }

            if (!/^[a-zA-Z0-9_-]+$/.test(room)) {
                errorMessage.textContent = 'Room name can only contain letters, numbers, underscores, and hyphens';
                return;
            }

            errorMessage.textContent = '';
            window.location.href = `/chat/${room}/`;
        }

        joinButton.addEventListener('click', () => joinRoom());

        roomInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') joinRoom();
        });

        roomInput.addEventListener('input', function() {
            errorMessage.textContent = '';
        });
    </script>
</body>
</html>
